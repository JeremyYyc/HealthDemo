name: PRD hash check

on:
  push:
    paths:
      - "docs/prd/**"
      - "scripts/verify-prd-hashes.sh"
      - ".github/workflows/prd-hash-check.yml"
  pull_request:
    paths:
      - "docs/prd/**"
      - "scripts/verify-prd-hashes.sh"
      - ".github/workflows/prd-hash-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify frozen PRD hashes
        run: ./scripts/verify-prd-hashes.sh
