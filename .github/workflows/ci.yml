name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  actions: read
  checks: read
  contents: read
  statuses: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: health_demo
          POSTGRES_PASSWORD: health_demo
          POSTGRES_DB: health_demo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U health_demo -d health_demo_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://health_demo:health_demo@localhost:5432/health_demo_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: health_demo
          POSTGRES_PASSWORD: health_demo
          POSTGRES_DB: health_demo_coverage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U health_demo -d health_demo_coverage"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://health_demo:health_demo@localhost:5432/health_demo_coverage?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: health_demo
          POSTGRES_PASSWORD: health_demo
          POSTGRES_DB: health_demo_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U health_demo -d health_demo_browser"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://health_demo:health_demo@localhost:5432/health_demo_browser?schema=public
      SESSION_TOKEN_SECRET: browser-ci-session-secret-at-least-32-characters
      SESSION_COOKIE_SECURE: "false"
      APP_BASE_URL: http://127.0.0.1:3100
      E2E_REAL_BACKEND: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  deployment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: health_demo
          POSTGRES_PASSWORD: health_demo
          POSTGRES_DB: health_demo_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U health_demo -d health_demo_smoke"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://health_demo:health_demo@localhost:5432/health_demo_smoke?schema=public
      SESSION_TOKEN_SECRET: smoke-ci-session-secret-at-least-32-characters
      SESSION_COOKIE_SECURE: "false"
      APP_BASE_URL: http://127.0.0.1:3100
      SMOKE_BASE_URL: http://127.0.0.1:3100
      SMOKE_ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:migrate
      - run: npm run build
      - name: Run API delivery smoke
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/health-demo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3100/api/health; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:3100/api/health
          npm run smoke:deployment

  quality-gate:
    if: always()
    needs: [check, postgres-integration, coverage, browser-e2e, deployment-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every P0 delivery check
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          INTEGRATION_RESULT: ${{ needs.postgres-integration.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          E2E_RESULT: ${{ needs.browser-e2e.result }}
          SMOKE_RESULT: ${{ needs.deployment-smoke.result }}
        run: |
          test "$CHECK_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$E2E_RESULT" = success
          test "$SMOKE_RESULT" = success

  deployment-preview-acceptance:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'deployment-preview'
    name: deployment-preview-acceptance / preview-smoke
    runs-on: ubuntu-latest
    environment: preview
    env:
      SMOKE_BASE_URL: ${{ vars.DEPLOYMENT_PREVIEW_URL }}
      SMOKE_ENVIRONMENT: preview
      SMOKE_EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      SMOKE_REQUIRE_DEMO_EXCHANGE: "true"
    steps:
      - name: Require release gates
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$SMOKE_BASE_URL" in
            https://*) ;;
            *) exit 1 ;;
          esac
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEPLOYED_SHA}/check-runs" \
            --jq '.check_runs[] | select(.name == "quality-gate") | .conclusion' | head -n 1)
          test "$conclusion" = success
          review_state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEPLOYED_SHA}/status" \
            --jq '.statuses[] | select(.context == "independent-agent-review") | .state' | head -n 1)
          test "$review_state" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run deployment smoke
        env:
          SMOKE_REVIEW_CODE: ${{ secrets.DEMO_REVIEW_CODE }}
          SMOKE_VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run smoke:deployment

  deployment-production-acceptance:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'deployment-production'
    name: deployment-production-acceptance / production-smoke
    runs-on: ubuntu-latest
    environment: production
    env:
      SMOKE_BASE_URL: ${{ vars.DEPLOYMENT_PRODUCTION_URL }}
      SMOKE_ENVIRONMENT: production
      SMOKE_EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      SMOKE_REQUIRE_DEMO_EXCHANGE: "true"
      PREVIEW_RUN_URL: ${{ vars.DEPLOYMENT_PREVIEW_RUN_URL }}
    steps:
      - name: Require Preview evidence and release gates
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$SMOKE_BASE_URL" in
            https://*) ;;
            *) exit 1 ;;
          esac
          expected_prefix="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/"
          case "$PREVIEW_RUN_URL" in
            "${expected_prefix}"*) ;;
            *) echo "Preview evidence must be an Actions run in ${GITHUB_REPOSITORY}" >&2; exit 1 ;;
          esac
          preview_run_id="${PREVIEW_RUN_URL#"$expected_prefix"}"
          case "$preview_run_id" in
            ""|*[!0-9]*) echo "Preview evidence must end with one numeric run ID" >&2; exit 1 ;;
          esac
          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${preview_run_id}")
          test "$(jq -r '.repository.full_name' <<<"$run_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$DEPLOYED_SHA"
          test "$(jq -r '.path' <<<"$run_json")" = .github/workflows/ci.yml
          test "$(jq -r '.name' <<<"$run_json")" = CI
          test "$(jq -r '.event' <<<"$run_json")" = pull_request
          preview_job=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${preview_run_id}/jobs" \
            --jq '.jobs[] | select(.name == "deployment-preview-acceptance / preview-smoke") | .conclusion' \
            | head -n 1)
          test "$preview_job" = success
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEPLOYED_SHA}/check-runs" \
            --jq '.check_runs[] | select(.name == "quality-gate") | .conclusion' | head -n 1)
          test "$conclusion" = success
          review_state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEPLOYED_SHA}/status" \
            --jq '.statuses[] | select(.context == "independent-agent-review") | .state' | head -n 1)
          test "$review_state" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run deployment smoke
        env:
          SMOKE_REVIEW_CODE: ${{ secrets.DEMO_REVIEW_CODE }}
          SMOKE_VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run smoke:deployment
