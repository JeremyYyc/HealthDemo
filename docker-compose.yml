services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: health_demo
      POSTGRES_PASSWORD: health_demo
      POSTGRES_DB: health_demo
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_demo -d health_demo"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - health-demo-postgres:/var/lib/postgresql/data
      - ./tests/fixtures/create-test-database.sql:/docker-entrypoint-initdb.d/01-create-test-database.sql:ro

volumes:
  health-demo-postgres:
